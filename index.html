<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYUMBANI FRESH BLENDS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000000;
  --gold:#D4AF37;
  --terracotta:#8E3E26;
  --glass:rgba(212,175,55,0.04);
  --glass-border:rgba(212,175,55,0.15);
}
*{ margin:0; padding:0; box-sizing:border-box; scroll-behavior:smooth; }
body{ background:var(--black); color:var(--gold); font-family: 'Playfair Display', serif; overflow-x:hidden; }

/* AMBIENCE */
.bg{ position:fixed; inset:0; background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)); z-index:-2; }
.ambience-layer { position: fixed; inset: 0; background-size: cover; background-position: center; z-index: -1; opacity: 0.18; transition: background-image 0.6s ease-in-out, opacity 0.6s; }

/* SIDE MENU */
.side-menu {
  position: fixed; top: 0; right: -300px; width: 300px; height: 100%;
  background: rgba(0,0,0,0.95); border-left: 1px solid var(--terracotta);
  z-index: 2000; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex; flex-direction: column; padding: 100px 40px; gap: 20px;
}
.side-menu.active { right: 0; }
.menu-close { position: absolute; top: 20px; left: 20px; color: var(--gold); cursor: pointer; font-size: 2rem; }
.side-menu a { color: var(--gold); text-decoration: none; font-size: 1.2rem; font-family: 'Cinzel', serif; }

header{ position:fixed; top:0; width:100%; z-index:999; backdrop-filter:blur(15px); background:rgba(0,0,0,0.8); border-bottom:1px solid var(--glass-border); padding:15px 7%; display:flex; justify-content:space-between; align-items:center; }
.hamburger { cursor: pointer; color: var(--gold); font-size: 1.5rem; }

/* PAGE VIEWS */
.page-view { display: none; animation: fadeInView 0.5s ease-in-out forwards; }
.page-view.active-view { display: block; }
@keyframes fadeInView { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* PRODUCTS */
.products{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:25px; padding: 20px; }
.spice-card{ background:rgba(10,10,10,0.9); padding:20px; border: 1px solid var(--glass-border); }
.spice-name-glow { font-family: 'Cinzel', serif; color: var(--gold); display: block; margin-bottom: 15px; border-bottom: 1px solid var(--terracotta); }
.tier { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 4px 0; }

.btn { display:inline-block; padding:12px 30px; background:var(--terracotta); color:white; border:none; cursor:pointer; font-family: 'Cinzel', serif; }
</style>
</head>
<body>

<div class="bg"></div>
<div id="ambience-canvas" class="ambience-layer"></div>

<!-- SIDE MENU -->
<div class="side-menu" id="sideMenu">
  <div class="menu-close" onclick="toggleMenu()">×</div>
  <a onclick="navigateToPage('home-page'); toggleMenu()">Home</a>
  <a onclick="navigateToPage('products-page'); toggleMenu()">Collection</a>
  <a onclick="navigateToPage('feedback-page'); toggleMenu()">Reviews</a>
  <a onclick="navigateToPage('contact-page'); toggleMenu()">Contact</a>
</div>

<header>
  <div class="logo">NYUMBANI FRESH BLENDS</div>
  <div class="hamburger" onclick="toggleMenu()">☰</div>
</header>

<div id="home-page" class="page-view active-view">
  <section style="padding: 150px 10% 50px;">
    <h1>Welcome Home</h1>
    <p>Authentic Kenyan purity in every blend.</p>
  </section>
</div>

<div id="products-page" class="page-view">
  <section style="padding: 120px 5% 50px;">
    <h2>The Price List</h2>
    <div class="products" id="productGrid"></div>
  </section>
</div>

<div id="feedback-page" class="page-view">
  <section style="padding: 120px 5% 50px;">
    <form id="reviewForm">
      <input type="text" id="name" placeholder="Name" required style="width:100%; padding:10px; margin-bottom:10px;">
      <textarea id="comment" placeholder="Your review..." required style="width:100%; padding:10px;"></textarea>
      <button type="submit" class="btn">Post Review</button>
    </form>
    <div id="reviewsContainer" style="margin-top:30px;"></div>
  </section>
</div>

<script>
// 1. NAVIGATION
function toggleMenu() { document.getElementById('sideMenu').classList.toggle('active'); }
function navigateToPage(id) {
  document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active-view'));
  document.getElementById(id).classList.add('active-view');
}

// 2. PRODUCT DATA
const spiceData = [
  {name: 'Ginger', p: [200, 440, 880, 1760]},
  {name: 'Black pepper whole', p: [260, 650, 1300, 2600]},
  {name: 'Black pepper powder', p: [270, 670, 1340, 2680]},
  {name: 'Cardamom', p: [545, 1360, 2720, 5430]},
  {name: 'Cinnamon whole', p: [140, 350, 700, 1400]},
  {name: 'Cinnamon sticks', p: [170, 430, 860, 1720]},
  {name: 'Cumin powder', p: [200, 450, 900, 1800]},
  {name: 'Cumin seed', p: [180, 430, 860, 1720]},
  {name: 'Coriander powder', p: [110, 270, 540, 1000]},
  {name: 'Coriander seeds', p: [100, 250, 500, 1000]},
  {name: 'Fenugreek seeds', p: [130, 320, 640, 1200]},
  {name: 'Fenugreek powder', p: [150, 350, 700, 1400]},
  {name: 'Indian Tumeric', p: [170, 410, 820, 1640]},
  {name: 'Local Tumeric', p: [100, 230, 460, 900]},
  {name: 'Garlic', p: [135, 335, 670, 1340]},
  {name: 'Cloves powder', p: [240, 590, 1180, 2360]},
  {name: 'Cloves whole', p: [230, 560, 1120, 2240]},
  {name: 'Hibiscus powder', p: [345, 690, 1380, 2760]},
  {name: 'Royco', p: [140, 345, 690, 1380]},
  {name: 'Beef masala', p: [170, 410, 820, 1640]},
  {name: 'Chicken Masala', p: [150, 330, 660, 1320]},
  {name: 'Pilau Masala', p: [215, 535, 1070, 2130]},
  {name: 'Garam Masala', p: [160, 385, 770, 1530]},
  {name: 'Paprika', p: [170, 410, 820, 1640]},
  {name: 'Chili pepper', p: [160, 370, 740, 1440]},
  {name: 'Cayenne', p: [150, 330, 660, 1320]},
  {name: 'Flax seeds', p: [140, 300, 600, 1200]},
  {name: 'Chia seeds', p: [150, 350, 700, 1400]},
  {name: 'Baobab Powder', p: [110, 265, 530, 1060]},
  {name: 'Chai Masala', p: [150, 380, 760, 1520]},
  {name: 'Green Tea', p: [100, 250, 500, 1000]},
  {name: 'Curry Powder', p: [140, 345, 690, 1380]}
];

const grid = document.getElementById('productGrid');
spiceData.forEach(s => {
  grid.innerHTML += `<div class="spice-card"><span class="spice-name-glow">${s.name}</span>
    <div class="tier"><span>100g</span><span>${s.p[0]}sh</span></div>
    <div class="tier"><span>250g</span><span>${s.p[1]}sh</span></div>
    <div class="tier"><span>500g</span><span>${s.p[2]}sh</span></div>
    <div class="tier"><span>1kg</span><span>${s.p[3]}sh</span></div></div>`;
});

// 3. PERSISTENT REVIEWS
const form = document.getElementById('reviewForm');
const cont = document.getElementById('reviewsContainer');

function loadReviews() {
  const saved = JSON.parse(localStorage.getItem('nyumbani_reviews') || '[]');
  cont.innerHTML = saved.map(r => `<div style="border-left:2px solid var(--gold); padding:10px; margin-bottom:10px;"><strong>${r.name}</strong><p>${r.text}</p></div>`).join('');
}

form.onsubmit = (e) => {
  e.preventDefault();
  const reviews = JSON.parse(localStorage.getItem('nyumbani_reviews') || '[]');
  reviews.push({ name: document.getElementById('name').value, text: document.getElementById('comment').value });
  localStorage.setItem('nyumbani_reviews', JSON.stringify(reviews));
  form.reset();
  loadReviews();
};

loadReviews();
</script>
</body>
</html>
